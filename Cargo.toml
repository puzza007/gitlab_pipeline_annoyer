[package]
name = "gitlab_pipeline_annoyer"
version = "0.1.0"
edition = "2021"

[dependencies]
gitlab = "0.1901.0"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", features = ["json", "query"] }
anyhow = "1.0"
